services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bpr-laravel-app
    container_name: bpr_app
    restart: always
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - bpr-network

  web:
    image: nginx:alpine
    container_name: bpr_nginx
    restart: always
    ports:
      - "3018:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - bpr-network

  db:
    image: mysql:5.7
    container_name: bpr_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-bpr_db}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - bpr-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dbdata:

networks:
  bpr-network:
    driver: bridge
