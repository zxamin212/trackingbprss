version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bpr-laravel-app
    container_name: bpr_app
    restart: always
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - bpr-network

  web:
    image: nginx:alpine
    container_name: bpr_nginx
    restart: always
    ports:
      - "8080:80" # Ubah port 8080 sesuai kebutuhan server Anda
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - bpr-network

  db:
    image: mysql:8.0
    container_name: bpr_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - bpr-network

volumes:
  dbdata:

networks:
  bpr-network:
    driver: bridge